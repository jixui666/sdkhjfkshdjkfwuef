name: build-payload

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'payload dir to build (photonote)'
        required: true
        default: 'photonote'
  push:
    paths:
      - 'common/**'
      - 'photonote/**'
      - 'imtoken/**'
      - 'memscan/**'
      - '.github/workflows/build.yml'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "targets=[\"${{ github.event.inputs.target }}\"]" >> $GITHUB_OUTPUT
          else
            LIST=$(find . -maxdepth 2 -name '*.m' -not -path './common/*' -not -path './tools/*' \
                   | xargs -n1 dirname | sed 's|^\./||' | sort -u \
                   | grep -v '^common$' | grep -v '^tools$' \
                   | jq -R -s -c 'split("\n") | map(select(length>0))')
            echo "targets=$LIST" >> $GITHUB_OUTPUT
          fi
          cat $GITHUB_OUTPUT

  build:
    needs: detect
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build ${{ matrix.target }} arm64
        run: |
          mkdir -p out
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=14.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -dynamiclib -fobjc-arc -O2 -fvisibility=hidden \
            -Icommon -I${{ matrix.target }} \
            -framework Foundation -framework UIKit -framework Photos \
            -framework CoreGraphics -framework Security -framework IOKit \
            -lsqlite3 \
            -Wl,-exported_symbol,_plugin_main \
            -install_name @rpath/${{ matrix.target }}.dylib \
            -o out/${{ matrix.target }}_arm64.dylib \
            ${{ matrix.target }}/*.m common/*.m

      - name: Build ${{ matrix.target }} arm64e
        continue-on-error: true
        run: |
          xcrun --sdk iphoneos clang \
            -arch arm64e \
            -miphoneos-version-min=14.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -dynamiclib -fobjc-arc -O2 -fvisibility=hidden \
            -Icommon -I${{ matrix.target }} \
            -framework Foundation -framework UIKit -framework Photos \
            -framework CoreGraphics -framework Security -framework IOKit \
            -lsqlite3 \
            -Wl,-exported_symbol,_plugin_main \
            -install_name @rpath/${{ matrix.target }}.dylib \
            -o out/${{ matrix.target }}_arm64e.dylib \
            ${{ matrix.target }}/*.m common/*.m

      - name: Lipo
        run: |
          cd out
          if [ -f ${{ matrix.target }}_arm64e.dylib ]; then
            lipo -create -output ${{ matrix.target }}.dylib \
              ${{ matrix.target }}_arm64.dylib ${{ matrix.target }}_arm64e.dylib
          else
            cp ${{ matrix.target }}_arm64.dylib ${{ matrix.target }}.dylib
          fi
          lipo -info ${{ matrix.target }}.dylib
          ls -l ${{ matrix.target }}.dylib
          shasum -a 256 ${{ matrix.target }}.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: dylib-${{ matrix.target }}
          path: out/${{ matrix.target }}.dylib
